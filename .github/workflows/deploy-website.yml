name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Build static site
        working-directory: website
        env:
          # Microsoft Clarity session replay. Inlined at build time because the
          # site is a static export, so this is what decides whether the tag
          # ships at all - clearing the repository variable and re-running this
          # workflow removes it entirely, with no code change.
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
        run: npm run build

      # The bundle containing "clarity.ms" is shape. This drives the built page
      # in Chromium and asserts the custom tags actually fire, because a tag
      # that loads and never tags is indistinguishable from a working one in the
      # Clarity dashboard until you go looking for a filter that is not there.
      - name: Verify Clarity tags fire
        if: vars.CLARITY_PROJECT_ID != ''
        working-directory: website
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p /tmp/site/quantum-grand-challenges
          cp -r out/* /tmp/site/quantum-grand-challenges/
          (cd /tmp/site && python3 -m http.server 8090 &)
          for i in $(seq 1 20); do
            curl -sf "http://127.0.0.1:8090/quantum-grand-challenges/evaluate/" >/dev/null && break
            sleep 1
          done
          node scripts/verify-clarity.mjs http://127.0.0.1:8090/quantum-grand-challenges

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
