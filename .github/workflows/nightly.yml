name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Full resource estimation sweep
  estimation-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-nightly-${{ runner.os }}
          restore-keys: pip-ci-${{ runner.os }}-
      - name: Install dependencies
        run: pip install numpy scipy matplotlib pandas jsonschema pyyaml qdk==1.31.0

      - name: Run resource estimation sweep
        run: python tooling/generate_estimates.py

      - name: Upload estimation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: estimation-results
          path: |
            tooling/estimator/output/nightly_summary.json
            problems/*/estimates/*.json
            problems/archived/*/estimates/*.json
          retention-days: 14

  # KPI + platform recommendations refresh
  refresh-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-nightly-${{ runner.os }}
          restore-keys: pip-ci-${{ runner.os }}-
      - name: Install dependencies
        run: pip install numpy scipy matplotlib pandas pyyaml jsonschema

      - name: Refresh KPI dashboard
        run: |
          python tooling/reporting/stage_kpis.py \
            --policy tooling/reporting/maturity-policy.json \
            --out-md docs/objective-kpis.md \
            --out-json docs/objective-kpis.json

      - name: Audit Azure run-history metrics
        run: python tooling/reporting/audit_azure_run_history_metrics.py --min-resolved-coverage 0.85 --enforce-threshold

      - name: Generate platform recommendations
        run: |
          python tooling/reporting/recommend_platform_targets.py --preference balanced
          python tooling/reporting/recommend_platform_targets.py \
            --preference hardware-first \
            --out-md docs/platform-target-recommendations-hardware-first.md
          python tooling/reporting/recommend_platform_targets.py \
            --preference simulator-first \
            --out-md docs/platform-target-recommendations-simulator-first.md

      - name: Validate website data + matrix freshness
        run: |
          python tooling/reporting/validate_website_data_schema.py
          python tooling/reporting/check_verification_matrix_freshness.py || echo "::warning::Verification matrix stale (archived-problem make targets can drift in CI)"

      - name: Create PR for report updates
        id: create-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/nightly-reports
          commit-message: "chore(nightly): refresh KPIs + platform recommendations"
          title: "chore(nightly): refresh reports"
          body: "Automated nightly refresh of KPI dashboard and platform recommendations."
          labels: documentation,reporting

      - name: Warn if PR creation was not permitted
        if: steps.create-pr.outcome == 'failure'
        run: echo "::warning::Could not create PR  enable 'Allow GitHub Actions to create and approve pull requests' in repo Settings > Actions > General."

  # Runnable/correctness audit (with Q#)
  runnable-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-nightly-${{ runner.os }}
          restore-keys: pip-ci-${{ runner.os }}-
      - name: Install dependencies
        run: pip install numpy scipy matplotlib pandas pyyaml jsonschema qdk==1.31.0

      - name: Run correctness audit (classical only  Q# validated in estimation-sweep)
        run: python tooling/reporting/problem_runnable_correctness_audit.py --classical-timeout 180

      - name: Enforce all problems pass
        run: |
          python -c "
          import json; from pathlib import Path
          p = json.loads(Path('tooling/reporting/problem_runnable_correctness_report.json').read_text())
          s = p.get('summary', {}); total = int(s.get('total', 0)); passed = int(s.get('passed', 0))
          print(f'Correctness: {passed}/{total}')
          if passed != total: raise SystemExit(1)
          "

      - name: Upload correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runnable-correctness-report
          path: tooling/reporting/problem_runnable_correctness_report.json
          retention-days: 14

  # Daily arxiv paper ingestion.
  # The ingestion itself runs as the qgc-ingest-job Container Apps Job on its own
  # cron (0 6 * * *). The job runs inside Azure and authenticates with its managed
  # identity. This job only exists so the ingestion can be kicked off manually.
  arxiv-ingestion:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "dc692f3e-104b-4247-b52c-23692694684a",
              "subscriptionId": "82cd08af-0dac-4fc5-8a3a-f2ab9e4679c3"
            }

      - name: Trigger ingestion job and wait
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job start -n qgc-ingest-job -g qgc-evaluator -o none
          EXECUTION="$(az containerapp job execution list -n qgc-ingest-job -g qgc-evaluator \
            --query 'sort_by([], &properties.startTime)[-1].name' -o tsv)"
          echo "Started execution ${EXECUTION}"
          for _ in $(seq 1 60); do
            STATUS="$(az containerapp job execution show -n qgc-ingest-job -g qgc-evaluator \
              --job-execution-name "${EXECUTION}" --query properties.status -o tsv)"
            echo "status=${STATUS}"
            case "${STATUS}" in
              Succeeded) exit 0 ;;
              Failed|Degraded) echo "Ingestion job failed"; exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for ingestion job"
          exit 1

  # Every published verdict comes from the quantum-algorithms search index, which is
  # seeded from a committed JSON file. Nothing kept the two in step: on 2026-08-24 the
  # index held 48 documents against 47 in the file, an orphan left by an id-scheme
  # change, and it had been taking an evidence slot for months unnoticed.
  algorithm-index-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install azure-identity azure-search-documents==11.6.0

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "dc692f3e-104b-4247-b52c-23692694684a",
              "subscriptionId": "82cd08af-0dac-4fc5-8a3a-f2ab9e4679c3"
            }

      - name: Compare the deployed index against the committed file
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: dc692f3e-104b-4247-b52c-23692694684a
        run: python tooling/check_algorithm_index_drift.py

