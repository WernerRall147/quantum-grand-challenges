name: Deploy Evaluator API

# Build and deploy the FastAPI evaluator container to Azure Container Apps.
#
# Triggers:
#   - Manual (workflow_dispatch)  recommended path
#   - On push to main when API code or Dockerfile changes (auto-deploy)
#
# Required secrets (configure in repo Settings -> Secrets and variables -> Actions):
#   AZURE_CLIENT_ID          service principal app id (qgc-agent-sp)
#   AZURE_CLIENT_SECRET      service principal secret
#
# Tenant + subscription IDs are hardcoded below (not sensitive  public identifiers
# of the Azure tenant/sub the SP belongs to).
#
# Optional repo VARIABLES (override defaults if your resources differ):
#   ACR_NAME                 Azure Container Registry name (default: qgcregistry)
#   ACR_IMAGE_NAME           image repository inside the ACR (default: qgc-evaluator)
#   CONTAINER_APP_NAME       Container App name (default: qgc-eval-api)
#   CONTAINER_APP_RG         Resource group containing the Container App (default: qgc-evaluator)
#
# Local equivalent (after `az login --tenant <id>`):
#   az acr build --registry qgcregistry --image qgc-evaluator:<tag> --file Dockerfile .
#   az containerapp update --name qgc-eval-api --resource-group qgc-evaluator \
#       --image qgcregistry.azurecr.io/qgc-evaluator:<tag>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: short SHA)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "agents/api/**"
      - "agents/orchestrator/**"
      - "agents/classifier/**"
      - "agents/code_generator/**"
      - "knowledge/search/**"
      - "knowledge/ingest/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-evaluator-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-evaluator-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag and names
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(date -u +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "acr_name=${{ vars.ACR_NAME || 'qgcregistry' }}" >> $GITHUB_OUTPUT
          echo "image_name=${{ vars.ACR_IMAGE_NAME || 'qgc-evaluator' }}" >> $GITHUB_OUTPUT
          echo "app_name=${{ vars.CONTAINER_APP_NAME || 'qgc-eval-api' }}" >> $GITHUB_OUTPUT
          echo "app_rg=${{ vars.CONTAINER_APP_RG || 'qgc-evaluator' }}" >> $GITHUB_OUTPUT

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "dc692f3e-104b-4247-b52c-23692694684a",
              "subscriptionId": "82cd08af-0dac-4fc5-8a3a-f2ab9e4679c3"
            }

      - name: Build container image in ACR
        run: |
          az acr build \
            --registry "${{ steps.tag.outputs.acr_name }}" \
            --image "${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.image_tag }}" \
            --image "${{ steps.tag.outputs.image_name }}:latest" \
            --file Dockerfile \
            .

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "${{ steps.tag.outputs.app_name }}" \
            --resource-group "${{ steps.tag.outputs.app_rg }}" \
            --image "${{ steps.tag.outputs.acr_name }}.azurecr.io/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.image_tag }}"

      # The ingestion job runs the same image. Without this it stayed pinned to a
      # 2026-07-27 tag for three weeks, silently running an ingester two fixes behind.
      - name: Update ingestion job image
        run: |
          az containerapp job update \
            --name qgc-ingest-job \
            --resource-group "${{ steps.tag.outputs.app_rg }}" \
            --image "${{ steps.tag.outputs.acr_name }}.azurecr.io/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.image_tag }}"

      - name: Wait for revision and health-check
        run: |
          set -e
          FQDN=$(az containerapp show \
            --name "${{ steps.tag.outputs.app_name }}" \
            --resource-group "${{ steps.tag.outputs.app_rg }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "FQDN: $FQDN"

          # Wait for the new revision itself, not just any 200. The old revision
          # keeps serving / during the swap, so polling the endpoint alone
          # reports healthy while the new one is still starting, and the next
          # step then hits "no healthy upstream".
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision list \
              --name "${{ steps.tag.outputs.app_name }}" \
              --resource-group "${{ steps.tag.outputs.app_rg }}" \
              --query "[?properties.active].properties.healthState | [0]" -o tsv 2>/dev/null || echo "")
            echo "Attempt $i: revision healthState=${STATE:-unknown}"
            if [ "$STATE" = "Healthy" ]; then
              break
            fi
            sleep 5
          done

          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::API did not return 200 after 90s"
          exit 1

      - name: Functional smoke test (evaluate)
        run: |
          set -e
          FQDN=$(az containerapp show \
            --name "${{ steps.tag.outputs.app_name }}" \
            --resource-group "${{ steps.tag.outputs.app_rg }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          # The OpenAPI checks below are static and stayed green while
          # /api/evaluate returned 500, so actually call it.
          BODY='{"problem":"ground state energy of the FeMoco nitrogenase cofactor"}'

          # Retry 5xx: the ingress can still be moving traffic to the new
          # revision and answer "no healthy upstream" for a few seconds. A 4xx
          # or a bad body is a real failure and is not retried.
          CODE="000"
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /tmp/eval.json -w "%{http_code}" -m 240 \
              -X POST "https://${FQDN}/api/evaluate" \
              -H 'Content-Type: application/json' -d "$BODY" || echo "000")
            case "$CODE" in
              5*|000) echo "Attempt $attempt: HTTP $CODE, retrying"; sleep 15 ;;
              *) break ;;
            esac
          done

          if [ "$CODE" != "200" ]; then
            echo "::error::/api/evaluate returned HTTP $CODE"
            head -c 2000 /tmp/eval.json || true
            exit 1
          fi

          VERDICT=$(python3 -c "import json;print(json.load(open('/tmp/eval.json')).get('verdict',''))")
          if [ -z "$VERDICT" ]; then
            echo "::error::/api/evaluate returned 200 with no verdict"
            head -c 2000 /tmp/eval.json || true
            exit 1
          fi
          echo "/api/evaluate OK - verdict: $VERDICT"

      - name: Smoke-test new endpoints
        run: |
          set -e
          FQDN=$(az containerapp show \
            --name "${{ steps.tag.outputs.app_name }}" \
            --resource-group "${{ steps.tag.outputs.app_rg }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          # OpenAPI should advertise /api/generate-bicep
          OPENAPI=$(curl -sf "https://${FQDN}/openapi.json" || echo "")
          if echo "$OPENAPI" | grep -q "/api/generate-bicep"; then
            echo "/api/generate-bicep endpoint is registered."
          else
            echo "::error::/api/generate-bicep not found in OpenAPI spec"
            exit 1
          fi

          # Schema check: EvaluateResponse should expose bicep_template
          if echo "$OPENAPI" | grep -q "bicep_template"; then
            echo "EvaluateResponse exposes bicep_template field."
          else
            echo "::error::bicep_template missing from EvaluateResponse"
            exit 1
          fi

      - name: Smoke-test code generation end to end
        # The checks above confirm the endpoint is registered and the field is declared.
        # Neither notices when generation itself is dead: /api/evaluate catches generator
        # exceptions and returns an empty string, so the schema stays perfect while the
        # feature produces nothing. That is how Q# generation stayed broken in production.
        run: |
          set -e
          FQDN=$(az containerapp show \
            --name "${{ steps.tag.outputs.app_name }}" \
            --resource-group "${{ steps.tag.outputs.app_rg }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          curl -sS -X POST "https://${FQDN}/api/evaluate" \
            -H 'Content-Type: application/json' \
            --max-time 600 \
            -d '{"problem":"I need to find the ground state energy of the FeMoco nitrogenase cofactor for catalyst design","generate_code":true}' \
            -o /tmp/codegen.json

          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/codegen.json'))
          qsharp = data.get('qsharp_code') or ''
          estimation = data.get('estimation') or {}
          if not qsharp:
              print('::error::generate_code=true returned no Q#. '
                    f'estimation says: {str(estimation.get("error"))[:300]}')
              sys.exit(1)

          # Non-empty Q# is not the same as usable Q#. The estimator invokes an entry by
          # expression, and when it could not resolve one the response still carried 3k
          # characters of source while every Pareto row held a compiler error.
          failed = False
          # `error` is the compile-failure key and `estimate_error` the estimation one.
          # Checking only the second reported "no physical_qubits" for a program that had
          # not compiled at all, which said nothing about why.
          if estimation.get('error'):
              print(f'::error::{estimation["error"][:400]}')
              failed = True
          elif estimation.get('estimate_error'):
              print(f'::error::resource estimation failed: {estimation["estimate_error"][:300]}')
              failed = True
          elif estimation.get('physical_qubits') is None:
              print('::error::resource estimation returned no physical_qubits. '
                    f'entry_expression={estimation.get("entry_expression")!r}')
              failed = True

          pareto = data.get('resource_estimate_pareto') or []
          broken = [r for r in pareto if r.get('error')]
          if broken:
              print(f'::error::{len(broken)}/{len(pareto)} Pareto rows errored, '
                    f'first: {str(broken[0].get("error"))[:250]}')
              failed = True
          if failed:
              sys.exit(1)

          print(f'Q# generation OK - {len(qsharp)} chars, verdict {data.get("verdict")}, '
                f'entry {estimation.get("entry_expression")}, '
                f'{estimation.get("physical_qubits")} physical qubits, '
                f'{len(pareto)} Pareto rows')
          PY

      - name: Smoke-test Bicep generation end to end
        # The Q# check above passed for months while this path was dead: an AI/ML verdict
        # returned bicep_template="" with bicep_validation {'validated': True}, because an
        # empty .bicep file compiles and the validator read "compiler produced output".
        # Two generators, so two smoke tests - the quantum prompt never exercises this one.
        run: |
          set -e
          FQDN=$(az containerapp show \
            --name "${{ steps.tag.outputs.app_name }}" \
            --resource-group "${{ steps.tag.outputs.app_rg }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          curl -sS -X POST "https://${FQDN}/api/evaluate" \
            -H 'Content-Type: application/json' \
            --max-time 600 \
            -d '{"problem":"Train a neural network on 10 million images for medical diagnosis","generate_code":true}' \
            -o /tmp/bicepgen.json

          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/bicepgen.json'))
          platform = data.get('recommended_platform')
          template = data.get('bicep_template') or ''
          validation = data.get('bicep_validation') or {}

          if platform not in ('AI_ML', 'HPC'):
              print(f'::error::expected a non-quantum verdict to exercise the Bicep path, '
                    f'got recommended_platform={platform!r}')
              sys.exit(1)

          if not template.strip():
              print('::error::generate_code=true returned no Bicep. '
                    f'bicep_validation says: {str(validation)[:300]}')
              sys.exit(1)

          # A template that does not declare a resource is not a workspace, and would
          # still compile.
          if 'resource ' not in template:
              print(f'::error::Bicep template declares no resources ({len(template)} chars)')
              sys.exit(1)

          if validation.get('validated') is not True:
              print(f'::error::Bicep did not validate: {str(validation)[:400]}')
              sys.exit(1)

          print(f'Bicep generation OK - {len(template)} chars, platform {platform}, '
                f'{template.count("resource ")} resource declarations')
          PY

      - name: Deployment summary
        if: always()
        run: |
          echo "### Evaluator API Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.tag.outputs.acr_name }}.azurecr.io/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Container App: \`${{ steps.tag.outputs.app_name }}\` in \`${{ steps.tag.outputs.app_rg }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
