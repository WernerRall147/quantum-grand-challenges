name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ci-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: pip-ci-${{ runner.os }}-
      - name: Install dependencies
        run: pip install numpy scipy matplotlib pandas pytest jsonschema pyyaml qdk==1.31.0 azure-identity openai azure-search-documents==11.6.0
      - name: Validate workflow YAML
        # A workflow with broken YAML is still registered as "active"; GitHub
        # just shows the file path as its name and never runs it. That is how a
        # scheduled uptime probe shipped green and dead.
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  bad.append(f"{path}: does not parse: {exc}")
                  continue
              if not isinstance(doc, dict):
                  bad.append(f"{path}: is not a mapping")
                  continue
              if not doc.get("name"):
                  bad.append(f"{path}: has no name, so GitHub will display the file path")
              # PyYAML reads the bare key `on` as the boolean True.
              if True not in doc and "on" not in doc:
                  bad.append(f"{path}: has no triggers")
              if not doc.get("jobs"):
                  bad.append(f"{path}: has no jobs")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY
      - name: Validate Q# compilation
        run: python tooling/ci_validate_qsharp.py
      - name: Run Q# entry points
        run: python tooling/run_all_qsharp.py
      - name: Validate JSON schemas
        run: python tooling/ci_validate_schema.py
      - name: Run pytest baseline tests
        run: pytest test_baselines.py --tb=short -q
      - name: Enforce maturity contract
        run: python tooling/reporting/stage_kpis.py --policy tooling/reporting/maturity-policy.json --enforce
      - name: QAOA estimator smoke
        run: cd problems/archived/05_qaoa_maxcut && make estimate-all
      - name: Verify QAOA evidence
        run: |
          python problems/archived/05_qaoa_maxcut/python/validate_estimator_summary.py
          python problems/archived/05_qaoa_maxcut/python/validate_backend_assumptions.py
          python problems/archived/05_qaoa_maxcut/python/validate_evidence_quality.py
      - name: QAE runtime config + Q# check
        run: |
          python problems/archived/03_qae_risk/python/write_runtime_config.py \
            --loss-qubits 4 --threshold 2.5 --mean 0.0 --std-dev 1.0 \
            --precision-bits 6 --repetitions 120 --run-sanity-check false
          python -c "from qdk import qsharp; qsharp.init(project_root='problems/archived/03_qae_risk/qsharp'); print('QAE Q# OK')"
      - name: Evaluator smoke tests
        run: pytest agents/tests -v --tb=short
      - name: Router evaluation (offline, cached KB matches)
        run: python agents/evaluations/run_eval.py --offline
      - name: Narrative evaluation (offline, recorded model responses)
        run: python agents/evaluations/score_narrative.py --offline --strict
      - name: Verify matrix freshness + website schema
        run: |
          # Matrix freshness shells out to `make` per problem and can drift for
          # archived problems; treat as advisory (same policy as the nightly job)
          # so a stale matrix doesn't block CI. Website schema stays enforced.
          python tooling/reporting/check_verification_matrix_freshness.py || echo "::warning::Verification matrix stale  see the nightly job for the authoritative refresh"
          python tooling/reporting/validate_website_data_schema.py
          python tooling/reporting/check_homepage_stats.py
  quick-estimation:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-est-${{ runner.os }}
          restore-keys: pip-ci-${{ runner.os }}-
      - name: Install dependencies
        run: pip install numpy scipy jsonschema pyyaml
      - name: Validate estimation schemas
        run: |
          for f in problems/*/estimates/*.json problems/archived/*/estimates/*.json; do
            [ -f "$f" ] && python -c "
          import json, jsonschema
          schema = json.load(open('tooling/schema/result.json'))
          jsonschema.validate(json.load(open('$f')), schema)
          print('OK: $f')
          " || true
          done
